<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#18181b"/>
  <!-- Exit sign hanging broken -->
  <rect x="200" y="80" width="220" height="100" rx="8" fill="#15803d" stroke="#22c55e" stroke-width="4" transform="rotate(8 310 130)"/>
  <text x="310" y="145" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="34" text-anchor="middle" transform="rotate(8 310 130)">EXIT</text>
  <!-- Exposed colored wires dangling -->
  <path d="M 230 70 C 220 120, 190 140, 210 240" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  <path d="M 240 70 C 235 110, 215 150, 225 250" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
  <path d="M 250 70 C 260 120, 240 160, 245 235" fill="none" stroke="#eab308" stroke-width="6" stroke-linecap="round"/>
  <!-- Copper tips exposed -->
  <line x1="210" y1="235" x2="210" y2="248" stroke="#f59e0b" stroke-width="3"/>
  <line x1="225" y1="245" x2="225" y2="258" stroke="#f59e0b" stroke-width="3"/>
  <line x1="245" y1="230" x2="245" y2="243" stroke="#f59e0b" stroke-width="3"/>
  <!-- Warning badge -->
  <rect x="180" y="330" width="240" height="42" rx="21" fill="#dc2626"/>
  <text x="300" y="357" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" text-anchor="middle">Danger: Exposed Wires</text>
</svg>
