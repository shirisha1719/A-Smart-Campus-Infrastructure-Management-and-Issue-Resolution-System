<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#1e293b"/>
  <!-- Wall -->
  <line x1="0" y1="280" x2="600" y2="280" stroke="#334155" stroke-width="2"/>
  <!-- Desk Top -->
  <polygon points="120,200 480,200 450,230 90,230" fill="#b45309"/>
  <!-- Desk Front Edge -->
  <rect x="90" y="230" width="360" height="20" fill="#78350f"/>
  <!-- Left Leg Broken -->
  <path d="M 110 250 L 115 300 L 95 350" stroke="#d97706" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Fracture crack -->
  <path d="M 112 295 L 125 302 L 108 308" stroke="#ef4444" stroke-width="4" fill="none"/>
  <!-- Right Leg Normal -->
  <line x1="430" y1="250" x2="430" y2="350" stroke="#d97706" stroke-width="14" stroke-linecap="round"/>
  <!-- Power outlet sparking -->
  <rect x="340" y="140" width="50" height="60" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="355" cy="165" r="4" fill="#0f172a"/>
  <circle cx="375" cy="165" r="4" fill="#0f172a"/>
  <!-- Spark -->
  <polygon points="365,150 375,135 362,130 380,110 368,132 382,138" fill="#eab308"/>
  <rect x="30" y="30" width="200" height="38" rx="8" fill="#eab308"/>
  <text x="130" y="54" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" text-anchor="middle">Broken Leg + Sparks</text>
</svg>
