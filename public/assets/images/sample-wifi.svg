<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#090d16"/>
  <!-- Access Point on ceiling -->
  <rect x="220" y="40" width="160" height="50" rx="10" fill="#f8fafc"/>
  <circle cx="300" cy="75" r="5" fill="#ef4444"/>
  <!-- Crossed Out WiFi Signal -->
  <path d="M 230 180 A 100 100 0 0 1 370 180" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
  <path d="M 255 220 A 65 65 0 0 1 345 220" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
  <path d="M 280 260 A 30 30 0 0 1 320 260" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
  <circle cx="300" cy="290" r="10" fill="#ef4444"/>
  <!-- Red Slash Line -->
  <line x1="200" y1="140" x2="400" y2="330" stroke="#dc2626" stroke-width="14" stroke-linecap="round"/>
  <rect x="180" y="340" width="240" height="40" rx="20" fill="#ef4444"/>
  <text x="300" y="365" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="15" text-anchor="middle">WiFi Signal Offline</text>
</svg>
